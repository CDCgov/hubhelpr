name: "Set Up hubhelpr"
description: "This action sets up R with the hubhelpr package installed."
inputs:
  version:
    description: >
      Git reference (branch, tag, or commit SHA) of
      CDCgov/hubhelpr to install. If this is pinned to,
      a caller on a known version is held, so merges to
      main to do not change what the caller produces.
    required: false
    default: "main"
runs:
  using: "composite"
  steps:
    - name: "Set Up R"
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
        extra-repositories: "https://hubverse-org.r-universe.dev"

    - name: "Install hubhelpr"
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        pak-version: "devel"
        packages: |
          github::cdcgov/hubhelpr@${{ inputs.version }}
