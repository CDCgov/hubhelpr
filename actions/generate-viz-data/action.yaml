name: "Generate Visualization Data"
description: "Generate weekly visualization data files for a forecast hub, commit to a new branch, and create a pull request. Requires R and hubhelpr to be installed beforehand."

inputs:
  disease:
    description: "Disease identifier ('covid' or 'rsv')."
    required: true
  github_token:
    description: "GitHub token for creating the pull request."
    required: true
  hub_reports_path:
    description: "Path to the hub reports directory."
    required: false
    default: "."
  base_hub_path:
    description: "Path to the hub repository directory. If not provided, use the Hub S3 bucket for the given disease."
    required: false
    default: ""
  reference_date:
    description: "Reference date for the forecast (YYYY-MM-DD, must be a Saturday). Defaults to the last day of the current MMWR epiweek."
    required: false
    default: "latest"
  targets:
    description: "JSON array of full target names (e.g., '[\"wk inc covid hosp\", \"wk inc covid prop ed visits\"]'). Defaults to all unique targets in time-series data."
    required: false
    default: ""
  excluded_locations:
    description: "JSON array or object of US state/territory abbreviations to exclude. Array (e.g., '[\"VI\", \"GU\"]') excludes from all targets. Object (e.g., '{\"all\": [\"VI\"], \"wk inc covid hosp\": [\"GU\"]}') supports target-specific exclusions. Defaults to no exclusions."
    required: false
    default: "[]"
  n_models_for_ens_reporting:
    description: "Minimum number of designated model submissions required to include an ensemble forecast in the report. Defaults to the minimum rule for the reference date, so regenerating an older report applies the rule it was published under."
    required: false
    default: ""
  observed_data_use_hub:
    description: "Use Hub's own target data to generate observed data files (true) or pull from remote sources (false)"
    required: false
    default: false
  observed_data_as_of:
    description: "As of date for the observed data shown in the report. Either an string coercible by R's as.Date() or 'latest' to use the most recent available vintage. Used only when observed_data_use_hub is true)"
    required: false
    default: "latest"
  overwrite_existing:
    description: "Overwrite existing report files, if any?"
    required: false
    default: false

runs:
  using: "composite"
  steps:
    - name: "Generate Data Files"
      id: generate
      shell: Rscript {0}
      run: |
        input_date <- "${{ inputs.reference_date }}"
        if (input_date == "" || input_date == "latest") {
          ref_date <- forecasttools::ceiling_mmwr_epiweek(lubridate::today())
        } else {
          ref_date <- as.Date(input_date)
        }
        message("Using reference date: ", as.character(ref_date))

        base_hub_path <- "${{ inputs.base_hub_path }}"
        if (nchar(base_hub_path) == 0) base_hub_path <- NULL

        hub_reports_path <- "${{ inputs.hub_reports_path }}"
        disease <- "${{ inputs.disease }}"

        input_targets <- '${{ inputs.targets }}'
        if (nchar(input_targets) == 0) {
          targets <- NULL
        } else {
          targets <- jsonlite::fromJSON(input_targets)
        }

        excluded_locations <- jsonlite::fromJSON(
          "${{ inputs.excluded_locations }}"
        )

        input_n_models <- "${{ inputs.n_models_for_ens_reporting }}"
        if (nchar(input_n_models) == 0) {
          n_models_for_ens_reporting <- NULL
        } else {
          n_models_for_ens_reporting <- as.integer(input_n_models)
        }

        hubhelpr::generate_hub_report(
          reference_date = ref_date,
          disease = disease,
          hub_reports_path = hub_reports_path,
          base_hub_path = base_hub_path,
          excluded_locations = excluded_locations,
          targets = targets,
          n_models_for_ens_reporting = n_models_for_ens_reporting,
          observed_data_use_hub = as.logical("${{ inputs.observed_data_use_hub }}"),
          observed_data_as_of = "${{ inputs.observed_data_as_of }}",
          overwrite_existing = as.logical("{{ inputs.overwrite_existing }}")
        )


        writeLines(
          sprintf("date=%s", as.character(ref_date)),
          Sys.getenv("GITHUB_OUTPUT")
        )

    - name: "Commit Changes"
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "add-viz-${{ inputs.disease }}-data-${{ steps.generate.outputs.date }}"
        git add "weekly-summaries"
        git commit -m "Update weekly ${{ inputs.disease }} visualization data"
        git push origin "add-viz-${{ inputs.disease }}-data-${{ steps.generate.outputs.date }}"

    - name: "Create Pull Request"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh pr create --base main \
          --head "add-viz-${{ inputs.disease }}-data-${{ steps.generate.outputs.date }}" \
          --title "Weekly ${{ inputs.disease }} forecast visualization data" \
          --body "This PR is generated automatically to add weekly visualization data files for ${{ inputs.disease }}."
