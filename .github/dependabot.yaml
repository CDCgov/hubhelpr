version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - /
      - /actions/*
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    pull-request-branch-name:
      separator: "-"
    labels:
      - "Automation"
